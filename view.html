<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wardrobe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#FFFFFF;
      --ink:#111111;
      --muted:#8A8A8A;
      --line:#ECECEC;
      --pill-bg:#F1F1F1;
      --pill-ink:#444444;
      --accent-bg:#EBEEFC;
      --accent-ink:#3452E1;
    }
    *{box-sizing:border-box;}
    body{
      background:var(--bg);color:var(--ink);
      font-family:"Instrument Sans",system-ui,sans-serif;
      margin:0;padding:32px 20px 72px;
    }
    .wrap{max-width:520px;margin:0 auto;}
    .eyebrow{
      font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted);margin-bottom:6px;
    }
    h1{
      font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
      font-size:26px;letter-spacing:-.01em;line-height:1.2;margin:0 0 28px;
    }
    .item{
      display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line);
      align-items:flex-start;text-decoration:none;color:inherit;
    }
    .item:first-of-type{border-top:none;}
    .item img{
      width:92px;height:118px;object-fit:cover;border-radius:12px;
      background:var(--pill-bg);flex-shrink:0;
    }
    .info{min-width:0;padding-top:2px;}
    .name{font-weight:600;font-size:14px;line-height:1.35;margin-bottom:8px;}
    .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--pill-bg);color:var(--pill-ink);}
    .pill.accent{background:var(--accent-bg);color:var(--accent-ink);}
    .price{font-size:13px;color:var(--ink);font-weight:600;}
    .note{font-size:12.5px;color:var(--accent-ink);margin-top:8px;font-style:italic;}

    #empty,#error{
      text-align:center;color:var(--muted);font-size:14px;padding:60px 20px;
    }
    #error{color:#C0392B;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow" hidden>Wardrobe</div>
    <h1 id="heading">Wardrobe</h1>
    <div id="empty" hidden>No items saved yet.</div>
    <div id="error" hidden></div>
    <div id="list"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dsgjgnutkrwfgnrhfvnb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YIbIGsNUjfdO1zI2PGoMUA_o8M4ahtn';

    async function loadWardrobe() {
      const params = new URLSearchParams(location.search);
      const wardrobeId = params.get('w');

      if (!wardrobeId) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = 'No wardrobe specified in the link.';
        return;
      }

      let items;
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/wardrobes?id=eq.${encodeURIComponent(wardrobeId)}&select=name,items(*)&items.order=created_at.desc`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        if (!res.ok) throw new Error(`Request failed (${res.status})`);
        const rows = await res.json();
        const wardrobe = rows[0];
        items = wardrobe?.items || [];
        if (wardrobe?.name) {
          document.getElementById('heading').textContent = wardrobe.name;
          document.getElementById('eyebrow').hidden = false;
        }
      } catch (err) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = `Couldn't load this wardrobe: ${err.message}`;
        return;
      }

      if (items.length === 0) {
        document.getElementById('empty').hidden = false;
        return;
      }

      const list = document.getElementById('list');
      items.forEach((item) => {
        const a = document.createElement('a');
        a.className = 'item';
        a.href = item.url || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const img = document.createElement('img');
        img.src = item.image || '';
        img.alt = item.title || '';

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = item.title || '(untitled)';

        const row = document.createElement('div');
        row.className = 'row';
        if (item.size) {
          const sizePill = document.createElement('span');
          sizePill.className = 'pill accent';
          sizePill.textContent = `Size ${item.size}`;
          row.append(sizePill);
        }
        if (item.site) {
          const sitePill = document.createElement('span');
          sitePill.className = 'pill';
          sitePill.textContent = item.site.replace(/^www\./, '');
          row.append(sitePill);
        }

        info.append(name, row);

        if (item.price) {
          const price = document.createElement('div');
          price.className = 'price';
          price.textContent = item.price;
          info.append(price);
        }

        if (item.note) {
          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = `"${item.note}"`;
          info.append(note);
        }

        a.append(img, info);
        list.appendChild(a);
      });
    }

    loadWardrobe();
  </script>
</body>
</html>
