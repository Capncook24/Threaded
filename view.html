<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wardrobe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#FFFFFF;
      --ink:#111111;
      --muted:#8A8A8A;
      --line:#ECECEC;
      --pill-bg:#F1F1F1;
      --pill-ink:#444444;
      --accent-bg:#EBEEFC;
      --accent-ink:#3452E1;
    }
    *{box-sizing:border-box;}
    body{
      background:var(--bg);color:var(--ink);
      font-family:"Instrument Sans",system-ui,sans-serif;
      margin:0;padding:32px 20px 72px;
    }
    .wrap{max-width:520px;margin:0 auto;}
    .eyebrow{
      font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted);margin-bottom:6px;
    }
    h1{
      font-family:"Bricolage Grotesque",sans-serif;font-weight:700;
      font-size:26px;letter-spacing:-.01em;line-height:1.2;margin:0 0 8px;
    }
    .gift-banner{
      font-size:12px;color:var(--accent-ink);background:var(--accent-bg);
      padding:8px 12px;border-radius:10px;margin-bottom:24px;
    }
    .tabs{
      display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;padding-bottom:2px;
      -webkit-overflow-scrolling:touch;
    }
    .tab{
      flex:0 0 auto;font-size:13px;font-weight:600;padding:8px 16px;border-radius:20px;
      background:var(--pill-bg);color:var(--pill-ink);border:none;cursor:pointer;font-family:inherit;
    }
    .tab.active{background:var(--accent-ink);color:#fff;}
    .my-hint{font-size:12px;color:var(--muted);margin:-8px 0 20px;}
    .my-hint-link{
      font-size:12px;font-weight:600;color:var(--accent-ink);background:none;border:none;
      padding:0;cursor:pointer;text-decoration:underline;font-family:inherit;
    }
    .item{padding:20px 0;border-top:1px solid var(--line);}
    .item:first-of-type{border-top:none;}
    .item-link{
      display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:inherit;
    }
    .item-link img{
      width:92px;height:118px;object-fit:cover;border-radius:12px;
      background:var(--pill-bg);flex-shrink:0;
    }
    .info{min-width:0;padding-top:2px;}
    .name{font-weight:600;font-size:14px;line-height:1.35;margin-bottom:8px;}
    .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
    .pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--pill-bg);color:var(--pill-ink);}
    .pill.accent{background:var(--accent-bg);color:var(--accent-ink);}
    .price{font-size:13px;color:var(--ink);font-weight:600;}
    .note{font-size:12.5px;color:var(--accent-ink);margin-top:8px;font-style:italic;}

    .claim{margin-top:14px;padding-left:108px;}
    .claim-btn{
      font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-bg);
      border:none;padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;
    }
    .claim-form{display:flex;gap:6px;}
    .claim-form input{
      font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;
      flex:1;min-width:0;font-family:inherit;
    }
    .claim-form button{
      font-size:12px;font-weight:600;color:#fff;background:var(--accent-ink);
      border:none;padding:7px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;font-family:inherit;
    }
    .claimed{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:10px;}
    .claimed strong{color:var(--ink);}
    .claimed .undo{font-size:11px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;font-family:inherit;}

    #empty,#error{
      text-align:center;color:var(--muted);font-size:14px;padding:60px 20px;
    }
    #error{color:#C0392B;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow" hidden>Wardrobe</div>
    <h1 id="heading">Wardrobe</h1>
    <div class="gift-banner" id="giftBanner" hidden>You're viewing the gift-coordination link — you can mark items you're getting.</div>
    <div class="tabs" id="tabs" hidden></div>
    <div id="myHint"></div>
    <div id="empty" hidden>No items saved yet.</div>
    <div id="error" hidden></div>
    <div id="list"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dsgjgnutkrwfgnrhfvnb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_YIbIGsNUjfdO1zI2PGoMUA_o8M4ahtn';

    async function supabaseFetch(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
      });
      const text = await res.text();
      if (!res.ok) throw new Error(`Supabase ${res.status}: ${text}`);
      return text ? JSON.parse(text) : null;
    }

    function renderItem(item, giftMode) {
      const wrapper = document.createElement('div');
      wrapper.className = 'item';

      const link = document.createElement('a');
      link.className = 'item-link';
      link.href = item.url || '#';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';

      const img = document.createElement('img');
      img.src = item.image || '';
      img.alt = item.title || '';

      const info = document.createElement('div');
      info.className = 'info';

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.title || '(untitled)';

      const row = document.createElement('div');
      row.className = 'row';
      if (item.size) {
        const sizePill = document.createElement('span');
        sizePill.className = 'pill accent';
        sizePill.textContent = `Size ${item.size}`;
        row.append(sizePill);
      }
      if (item.site) {
        const sitePill = document.createElement('span');
        sitePill.className = 'pill';
        sitePill.textContent = item.site.replace(/^www\./, '');
        row.append(sitePill);
      }

      info.append(name, row);

      if (item.price) {
        const price = document.createElement('div');
        price.className = 'price';
        price.textContent = item.price;
        info.append(price);
      }

      if (item.note) {
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = `"${item.note}"`;
        info.append(note);
      }

      link.append(img, info);
      wrapper.append(link);

      if (giftMode) {
        const claim = document.createElement('div');
        claim.className = 'claim';
        renderClaim(claim, item);
        wrapper.append(claim);
      }

      return wrapper;
    }

    function renderClaim(claim, item) {
      claim.innerHTML = '';
      if (item.claimed_by) {
        const claimed = document.createElement('div');
        claimed.className = 'claimed';
        const text = document.createElement('span');
        text.innerHTML = `✓ <strong>${item.claimed_by}</strong> is getting this`;
        const undo = document.createElement('button');
        undo.className = 'undo';
        undo.textContent = 'Undo';
        undo.addEventListener('click', async () => {
          try {
            await supabaseFetch(`items?id=eq.${item.id}`, {
              method: 'PATCH',
              headers: { Prefer: 'return=minimal' },
              body: JSON.stringify({ claimed_by: null }),
            });
            item.claimed_by = null;
            renderClaim(claim, item);
          } catch (err) {
            alert(`Couldn't undo: ${err.message}`);
          }
        });
        claimed.append(text, undo);
        claim.append(claimed);
      } else {
        const btn = document.createElement('button');
        btn.className = 'claim-btn';
        btn.textContent = "I'm getting this";
        btn.addEventListener('click', () => {
          claim.innerHTML = '';
          const form = document.createElement('div');
          form.className = 'claim-form';
          const input = document.createElement('input');
          input.placeholder = 'Your name (optional)';
          const confirm = document.createElement('button');
          confirm.textContent = 'Confirm';
          confirm.addEventListener('click', async () => {
            const claimedBy = input.value.trim() || 'Someone';
            try {
              await supabaseFetch(`items?id=eq.${item.id}`, {
                method: 'PATCH',
                headers: { Prefer: 'return=minimal' },
                body: JSON.stringify({ claimed_by: claimedBy }),
              });
              item.claimed_by = claimedBy;
              renderClaim(claim, item);
            } catch (err) {
              alert(`Couldn't save: ${err.message}`);
            }
          });
          form.append(input, confirm);
          claim.append(form);
        });
        claim.append(btn);
      }
    }

    function renderList(items, giftMode) {
      const list = document.getElementById('list');
      list.innerHTML = '';
      document.getElementById('empty').hidden = items.length > 0;
      items.forEach((item) => {
        list.appendChild(renderItem(item, giftMode));
      });
    }

    function getMyWardrobeId(familyId) {
      try {
        return localStorage.getItem(`threaded_my_wardrobe_${familyId}`);
      } catch (err) {
        return null;
      }
    }

    function setMyWardrobeId(familyId, wardrobeId) {
      try {
        if (wardrobeId) {
          localStorage.setItem(`threaded_my_wardrobe_${familyId}`, wardrobeId);
        } else {
          localStorage.removeItem(`threaded_my_wardrobe_${familyId}`);
        }
      } catch (err) {
        // If storage is unavailable, the hint just won't persist across visits — not fatal.
      }
    }

    function renderMyHint(hintEl, member, isMine, configured, familyId, onChange) {
      hintEl.innerHTML = '';
      // Once someone's tab is configured, every other tab just shows claiming normally —
      // nothing left to configure there.
      if (configured && !isMine) return;

      if (isMine) {
        const p = document.createElement('p');
        p.className = 'my-hint';
        p.textContent = "This is your own list — claims are hidden here so nothing's spoiled. ";
        const reset = document.createElement('button');
        reset.className = 'my-hint-link';
        reset.textContent = "Not you?";
        reset.addEventListener('click', () => {
          setMyWardrobeId(familyId, null);
          onChange();
        });
        p.append(reset);
        hintEl.append(p);
      } else {
        const p = document.createElement('p');
        p.className = 'my-hint';
        const link = document.createElement('button');
        link.className = 'my-hint-link';
        link.textContent = 'Is this your wardrobe? Hide my surprises here';
        link.addEventListener('click', () => {
          setMyWardrobeId(familyId, member.id);
          onChange();
        });
        p.append(link);
        hintEl.append(p);
      }
    }

    async function loadFamily(familyId) {
      let family;
      try {
        const rows = await supabaseFetch(
          `families?id=eq.${encodeURIComponent(familyId)}&select=wardrobes(id,name,items(*))&wardrobes.items.order=created_at.desc`
        );
        family = rows?.[0];
      } catch (err) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = `Couldn't load this family: ${err.message}`;
        return;
      }

      const members = family?.wardrobes || [];
      if (members.length === 0) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = 'No family found for this link.';
        return;
      }

      document.getElementById('eyebrow').hidden = false;
      document.getElementById('eyebrow').textContent = 'Family wardrobe';
      document.getElementById('heading').textContent = 'Wardrobes';

      const banner = document.getElementById('giftBanner');
      banner.hidden = false;

      const tabs = document.getElementById('tabs');
      const hint = document.getElementById('myHint');
      tabs.hidden = false;

      // Nobody sees any claim info until *someone* on this device has marked which
      // tab is theirs — so a first-ever visit can never accidentally spoil anything.
      // Once marked, that one tab stays safe forever here while every other tab
      // shows full claiming — one link serves both the owner and gift-buyers.
      const showTab = (member) => {
        const myWardrobeId = getMyWardrobeId(familyId);
        banner.textContent = myWardrobeId
          ? "Your own tab is hidden from claims on this device. Everyone else's tabs show what's already claimed."
          : "Tap your own name below, then \"hide my surprises,\" so claiming works for everyone else without spoiling yours.";
        const configured = myWardrobeId !== null;
        const isMine = member.id === myWardrobeId;
        const tabGiftMode = configured && !isMine;
        renderList(member.items || [], tabGiftMode);
        renderMyHint(hint, member, isMine, configured, familyId, () => showTab(member));
      };

      // If this device already knows which tab is yours, land there by default instead
      // of always showing whoever created the family first.
      const myWardrobeId = getMyWardrobeId(familyId);
      const defaultIndex = Math.max(0, members.findIndex((m) => m.id === myWardrobeId));

      members.forEach((member, i) => {
        const tab = document.createElement('button');
        tab.className = 'tab' + (i === defaultIndex ? ' active' : '');
        tab.textContent = member.name || 'Unnamed';
        tab.addEventListener('click', () => {
          tabs.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          showTab(member);
        });
        tabs.appendChild(tab);
      });

      showTab(members[defaultIndex]);
    }

    async function loadWardrobe() {
      const params = new URLSearchParams(location.search);
      const wardrobeId = params.get('w');
      const giftTokenParam = params.get('g');

      if (!wardrobeId) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = 'No wardrobe or family specified in the link.';
        return;
      }

      let items;
      let giftMode = false;
      try {
        // The plain link never even requests claim data — it's not just hidden in the UI,
        // it never crosses the wire unless you're on the gift-coordination link.
        const fields = giftTokenParam
          ? 'name,gift_token,items(*)'
          : 'name,items(id,title,price,image,url,site,size,note,created_at)';

        const rows = await supabaseFetch(
          `wardrobes?id=eq.${encodeURIComponent(wardrobeId)}&select=${fields}&items.order=created_at.desc`
        );
        const wardrobe = rows?.[0];
        items = wardrobe?.items || [];

        if (giftTokenParam && wardrobe?.gift_token === giftTokenParam) {
          giftMode = true;
          document.getElementById('giftBanner').hidden = false;
        }

        if (wardrobe?.name) {
          document.getElementById('heading').textContent = wardrobe.name;
          document.getElementById('eyebrow').hidden = false;
        }
      } catch (err) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = `Couldn't load this wardrobe: ${err.message}`;
        return;
      }

      if (items.length === 0) {
        document.getElementById('empty').hidden = false;
        return;
      }

      const list = document.getElementById('list');
      items.forEach((item) => {
        list.appendChild(renderItem(item, giftMode));
      });
    }

    (function start() {
      const params = new URLSearchParams(location.search);
      const familyId = params.get('fam');
      if (familyId) {
        loadFamily(familyId);
      } else {
        loadWardrobe();
      }
    })();
  </script>
</body>
</html>
